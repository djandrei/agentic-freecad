# SPDX-License-Identifier: LGPL-2.1-or-later
name: agentic-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agentic-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      builddir: build/relWithDebInfo
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          locked: true
          cache: true

      - name: Configure
        run: pixi run configure

      - name: Build
        run: pixi run build

      - name: C++ tests (Agentic)
        run: pixi run ${{ env.builddir }}/tests/Agentic_tests_run

      - name: Python tests (console)
        run: pixi run ${{ env.builddir }}/bin/FreeCADCmd -t TestAgenticApp

      - name: Python tests (GUI under Xvfb)
        run: pixi run xvfb-run -a ${{ env.builddir }}/bin/FreeCAD -t TestAgenticGui

      - name: Python tests (GUI, offscreen platform)
        env:
          QT_QPA_PLATFORM: offscreen
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: pixi run ${{ env.builddir }}/bin/FreeCAD -t TestAgenticGui

      - name: stdio end-to-end (FreeCAD)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: pixi run python3 tests/agentic/stdio_smoke.py ${{ env.builddir }}/bin/FreeCAD

      - name: stdio end-to-end (FreeCADCmd)
        run: pixi run python3 tests/agentic/stdio_smoke.py ${{ env.builddir }}/bin/FreeCADCmd

      - name: HTTP end-to-end
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: pixi run python3 tests/agentic/http_smoke.py ${{ env.builddir }}/bin/FreeCAD

      - name: Viewer end-to-end (agent mode under Xvfb)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: pixi run xvfb-run -a ${{ env.builddir }}/bin/FreeCAD --agent --agent-port 0 tests/agentic/viewer_check.py

      - name: Tool reference is up to date
        env:
          QT_QPA_PLATFORM: offscreen
          LIBGL_ALWAYS_SOFTWARE: "1"
          AGENTIC_TOOLS_MD: /tmp/tools.md
        run: |
          pixi run ${{ env.builddir }}/bin/FreeCAD tests/agentic/make_tools_reference.py
          diff -u doc/agentic/tools.md /tmp/tools.md
